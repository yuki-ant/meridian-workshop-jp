<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude が Claude を教える — セルフペース型 Claude ハンズオンワークショップ</title>
    <!-- 紹介スライド。ステップ 01 でページサーバーが表示します。deck.js は tutor/maint/intro-deck/ の JSX から
         build.mjs で作ったもので、React も vendor/ に同梱しているので、Babel も CDN も要りません（file:// でも開けます）。
         日本語フォントだけは、ほかのページと同じく Google Fonts から取得します。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141413;
        overflow: hidden;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      #deck-root {
        position: fixed;
        inset: 0;
      }
      .fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #edebe3;
        font: 16px/1.8 "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
        padding: 24px;
        text-align: center;
      }
      @keyframes introPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.55);
        }
        50% {
          box-shadow: 0 0 0 7px rgba(217, 119, 87, 0);
        }
      }
      @keyframes introBlink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      /* ?print: one slide per page, for a PDF handout. */
      html.print,
      html.print body {
        height: auto;
        overflow: visible;
        background: #fff;
      }
      html.print #deck-root {
        position: static;
      }
      html.print .print-page {
        break-after: page;
        page-break-after: always;
      }
      html.print * {
        box-shadow: none !important;
        animation: none !important;
      }
      @page {
        size: 1280px 720px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="deck-root">
      <div class="fallback">紹介スライドを読み込んでいます…<br />表示されない場合は、JavaScript を有効にしてください。</div>
    </div>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <!-- 講師紹介ページの内容（任意）。なくてもスライドは動きます。 -->
    <script src="presenter.js"></script>
    <script src="deck.js"></script>
  </body>
</html>
